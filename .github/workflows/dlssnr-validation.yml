name: Modular DLSS-NR validation
on:
  workflow_dispatch:
    inputs:
      windows_runner:
        description: Windows runner image
        type: choice
        default: windows-2022
        options: [windows-2022, windows-latest]
  push:
    branches: [feature/modular-dlssnr]
  pull_request:
    branches: [master]
jobs:
  portable:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init --depth 1 external/simpleini
      - run: bash tests/run_dlssnr_host.sh
  windows:
    # Both shader variants and the DX12 runtime pass on this image. windows-latest
    # currently crashes inside d3d10warp.dll; manual runs can reproduce it.
    runs-on: ${{ inputs.windows_runner || 'windows-2022' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ilammy/msvc-dev-cmd@v1
        id: toolchain
        with:
          arch: x64
      - name: Run portable and WARP checks
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        shell: pwsh
        run: |
          try {
            ./tests/run_dlssnr_windows.ps1 *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/nr-tests.log"
          } catch {
            $failure = $_.Exception.Message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=NR runner failure::$failure"
            if (Test-Path "$env:RUNNER_TEMP/nr-tests.log") {
              $lines = Get-Content "$env:RUNNER_TEMP/nr-tests.log" | Where-Object { $_ -match 'NR_STAGE:|NR_CRASH:|FAILED:|FAIL:|PASS:' }
              $message = ($lines -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=NR validation::$message"
            }
            throw
          }
      - name: Build the original solution and NR forwarder
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        shell: pwsh
        run: |
          msbuild OptiScaler.sln /m:4 /p:Configuration=Release /p:Platform=x64 /verbosity:minimal 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/nr-build.log"
          $buildExit = $LASTEXITCODE
          Write-Output "::notice title=MSBuild result::Exit code $buildExit"
          if ($buildExit -ne 0) {
            Get-Content "$env:RUNNER_TEMP/nr-build.log" | Where-Object { $_ -match 'error (C\d+|LNK\d+|MSB\d+)|fatal error|error:' } | Select-Object -Last 20 | ForEach-Object {
              $message = $_.ToString().Replace('%', '%25')
              Write-Output "::error title=MSBuild::$message"
            }
            exit $buildExit
          }
          if (!(Test-Path 'x64/Release/a/nvngx.dll_dlssnr.dll')) {
            Write-Output '::error title=NR package::NR forwarder missing from x64/Release/a'
            throw 'NR forwarder missing from package'
          }
          if (!(Test-Path 'x64/Release/a/Licenses/RenoDX_ATTRIBUTION.txt')) {
            Write-Output '::error title=NR package::NR shader license missing from package'
            throw 'NR shader license missing from package'
          }
      - name: Prepare downloadable Windows package
        shell: pwsh
        run: |
          if (!(Test-Path 'x64/Release/a/OptiScaler.dll')) { throw 'OptiScaler.dll missing from package' }
          Copy-Item LICENSE 'x64/Release/a/Licenses/OptiScaler_LICENSE.txt'
          Copy-Item docs/DLSSNR_INTEGRATION.md 'x64/Release/a/DLSSNR_INTEGRATION.md'
          "Source: https://github.com/$env:GITHUB_REPOSITORY/tree/$env:GITHUB_SHA" | Set-Content 'x64/Release/a/SOURCE.txt'
      - name: Upload Windows package
        id: package
        uses: actions/upload-artifact@v7.0.0
        with:
          name: OptiScaler-DLSSNR-v0.1.31-windows-x64
          path: x64/Release/a/
          if-no-files-found: error
          retention-days: 14
      - name: Show package download
        shell: pwsh
        run: Write-Output '::notice title=Windows package download::${{ steps.package.outputs.artifact-url }}'
